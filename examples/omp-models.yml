# 星驰网关 (https://api.xingchiapi.com)
# OpenAI Responses 兼容：工具调用 / 推理 effort / 流式均可用。
# 注意：
#  - 网关拒绝 previous_response_id（store 链路），必须 statefulResponses: false 全量回放。
#  - 网关按 User-Agent 的第一段（"/" 之前）判定客户端，只放行真实编程客户端
#    （omp/ pi/ opencode/ claude-cli/ cline/ cursor/ …），其余 403 client_not_allowed。
#    版本号不参与校验，所以写死当前版本即可；换客户端身份就改这一行，例如
#    User-Agent: "claude-cli/2.1.327 (external, cli)"
#  - 密钥放在 ~/.omp/agent/.env 的 XINGCHI_API_KEY（此处的值是环境变量名）。
#  - contextWindow/maxTokens 取 omp 内置目录里同名 id 的值；目录里没有的用通用默认
#    128000/32768（omp 的溢出提示与压缩会兜住偏小的估计）。
providers:
   xingchi:
      baseUrl: https://api.xingchiapi.com/v1
      api: openai-responses
      apiKey: XINGCHI_API_KEY
      headers:
         User-Agent: "omp/18.22.2"
      compat:
         # 网关没有 store 链：每轮全量回放上下文，不带 previous_response_id。
         statefulResponses: false
      models:
         - id: gpt-5.6
           name: GPT-5.6 (Sol)
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-5.6-sol
           name: GPT-5.6 Sol
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-5.6-terra
           name: GPT-5.6 Terra
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-5.6-luna
           name: GPT-5.6 Luna
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-6
           name: GPT-6
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-6-sol
           name: GPT-6 Sol
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-6-luna
           name: GPT-6 Luna
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         - id: gpt-6-astra
           name: GPT-6 Astra
           reasoning: true
           input: [text]
           contextWindow: 272000
           maxTokens: 128000
         # gpt-6.1-sol / gpt-6.1-terra 的上游通道只支持 Chat Completions，
         # 带工具调用会被网关拒（requires Responses for tool calls; this account
         # only supports Chat Completions），别拿它们跑工具活。
         - id: gpt-6.1-sol
           name: GPT-6.1 Sol
           reasoning: true
           input: [text]
           contextWindow: 500000
           maxTokens: 128000
         - id: gpt-6.1-terra
           name: GPT-6.1 Terra
           reasoning: true
           input: [text]
           contextWindow: 500000
           maxTokens: 128000
         - id: gpt-5.5
           name: GPT-5.5
           reasoning: true
           input: [text]
           contextWindow: 128000
           maxTokens: 32768
         - id: gpt-5.4
